[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-protocol"
version = "0.1.0"
description = "Application-neutral runtime for the Sovereign Protocol"
requires-python = ">=3.10"
dependencies = [
  "paramiko>=3.4,<6",
  "requests>=2.31,<3",
  "starlette>=0.37,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sovereign-host = "sovereign.app_server:main"
sovereign-trace-view = "sovereign.trace_view:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sovereign*"]

[tool.setuptools.package-data]
"sovereign.assets" = ["*.css", "*.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
